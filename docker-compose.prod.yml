
services:
  db:
    image: postgres:16-alpine
    container_name: xbnest-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-xbnest}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-xbnest}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xbnest-net

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/zesenzhu/xb-be:latest}
    container_name: xbnest-backend-prod
    restart: always
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    environment:
      DATABASE_URL: "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgrespassword}@db:5432/${DB_NAME:-xbnest}?sslmode=disable"
      PORT: 8081
    depends_on:
      db:
        condition: service_healthy
    networks:
      - xbnest-net

networks:
  xbnest-net:
    external: true

volumes:
  pgdata_prod:
