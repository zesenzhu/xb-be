name: Deploy Backend to Cloud

on:
  push:
    tags:
      - 'v*' # 仅当推送以 v 开头的版本 Tag 时触发编译与自动部署流水线 (例如 v1.0.0)

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Docker image
        run: |
          docker build -t xbnest-backend-prod:latest -f ./Dockerfile .

      - name: Save Docker image as tar archive
        run: |
          # 物理导出镜像并使用 gzip 强压缩，以极大压缩包大小方便网络传输
          docker save xbnest-backend-prod:latest | gzip > xbnest-backend-prod.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-tar
          path: xbnest-backend-prod.tar.gz
          retention-days: 1 # 仅保留 1 天，节省 Actions 的存储开销

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image-tar

      - name: Generate .env file
        run: |
          echo "DB_USER=${{ secrets.DB_USER || 'postgres' }}" > .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD || 'postgrespassword' }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME || 'xbnest' }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT || '5432' }}" >> .env
          echo "BACKEND_PORT=${{ secrets.BACKEND_PORT || '8081' }}" >> .env
          # ⚡ 重点避坑：直接绑定本地物理镜像，不走公网 ghcr.io
          echo "BACKEND_IMAGE=xbnest-backend-prod:latest" >> .env
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY || '' }}" >> .env
          echo "DEEPSEEK_BASE_URL=${{ secrets.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}" >> .env
          echo "DASHSCOPE_API_KEY=${{ secrets.DASHSCOPE_API_KEY || '' }}" >> .env
          echo "DASHSCOPE_BASE_URL=${{ secrets.DASHSCOPE_BASE_URL || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}" >> .env
          echo "DOUBAO_API_KEY=${{ secrets.DOUBAO_API_KEY || '' }}" >> .env
          echo "DOUBAO_BASE_URL=${{ secrets.DOUBAO_BASE_URL || 'https://ark.cn-beijing.volces.com/api/v3' }}" >> .env
          echo "DOUBAO_MODEL_ENDPOINT=${{ secrets.DOUBAO_MODEL_ENDPOINT || '' }}" >> .env

      - name: Copy docker-compose, .env and image tar via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          # ⚡ 将物理镜像压缩包一并 SCP 传输至服务器
          source: "docker-compose.prod.yml,.env,xbnest-backend-prod.tar.gz"
          target: "/www/wwwroot/xbnest/backend/"

      - name: SSH Remote Commands to Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            mkdir -p /www/wwwroot/xbnest/backend
            cd /www/wwwroot/xbnest/backend
            
            # 物理自动校验并静默组建外部 Docker 共享网络以打通隔离屏障
            docker network inspect xbnest-net >/dev/null 2>&1 || docker network create xbnest-net
            
            # ⚡ 核心加载步骤：如果物理镜像压缩包存在，执行 docker load 物理载入
            if [ -f "xbnest-backend-prod.tar.gz" ]; then
              echo "[Deploy] 🛡️ 发现后端物理镜像压缩包，开始执行 Docker 物理装载导入..."
              docker load -i xbnest-backend-prod.tar.gz
              echo "[Deploy] ✓ 镜像装载完成，正在清理临时物理包以节省服务器硬盘..."
              rm -f xbnest-backend-prod.tar.gz
            fi
            
            # 直接启动服务，此时本地已有镜像，不需要也不允许执行 pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
